name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check pages and local links
        run: node scripts/check-site.cjs

